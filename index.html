<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cloud Drive — Modern File Storage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f172a;
            --primary-dark: #020617;
            --accent: #3b82f6;
            --accent-light: #eff6ff;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 20px;
            --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --transition-all: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--gray-50);
            color: var(--gray-900);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* Auth screens - modern */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(59,130,246,0.06) 0%, rgba(15,23,42,0.02) 90%);
        }

        .auth-box {
            background: white;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 480px;
            padding: 40px 36px;
            border: 1px solid var(--gray-200);
            transition: var(--transition-all);
        }

        .auth-tabs {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--gray-200);
        }

        .auth-tab {
            padding: 12px 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            transition: var(--transition-all);
            position: relative;
        }

        .auth-tab.active {
            color: var(--accent);
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--gray-700);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-md);
            font-size: 15px;
            transition: var(--transition-all);
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 14px;
            border-radius: var(--border-radius-md);
            border: none;
            cursor: pointer;
            transition: var(--transition-all);
            background: white;
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: var(--shadow-xs);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-block {
            width: 100%;
        }

        .btn-google {
            background: white;
            border: 1px solid var(--gray-200);
            color: var(--gray-700);
            font-weight: 500;
        }

        .btn-google:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            color: var(--gray-400);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        .divider span {
            padding: 0 16px;
        }

        /* Main App */
        .app-container {
            display: none;
            min-height: 100vh;
        }

        .app-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-bar {
            flex: 1;
            max-width: 420px;
            margin: 0 32px;
        }

        .search-bar .form-control {
            background: var(--gray-100);
            border: none;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 14px;
        }

        .search-bar .form-control:focus {
            background: white;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            box-shadow: var(--shadow-sm);
        }

        .app-main {
            display: flex;
            gap: 32px;
            padding: 32px 0;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: var(--border-radius-md);
            font-weight: 500;
            color: var(--gray-600);
            transition: var(--transition-all);
            cursor: pointer;
        }

        .nav-item i {
            width: 20px;
            font-size: 18px;
        }

        .nav-item:hover {
            background: var(--gray-100);
            color: var(--gray-900);
        }

        .nav-item.active {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
        }

        .storage-info {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-lg);
            padding: 20px;
            margin-top: 24px;
        }

        .storage-bar {
            height: 6px;
            background: var(--gray-200);
            border-radius: 10px;
            margin: 12px 0;
            overflow: hidden;
        }

        .storage-used {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            width: 0%;
        }

        .content {
            flex: 1;
            background: white;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--gray-200);
            overflow: hidden;
        }

        .content-header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .folder-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .breadcrumb-item {
            color: var(--gray-500);
            cursor: pointer;
            transition: color 0.2s;
        }

        .breadcrumb-item:hover {
            color: var(--accent);
        }

        .breadcrumb-item.active {
            color: var(--gray-900);
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-outline {
            border: 1px solid var(--gray-200);
            background: white;
        }

        .btn-outline:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .upload-area {
            margin: 24px 28px;
            border: 1px dashed var(--gray-300);
            border-radius: var(--border-radius-lg);
            padding: 32px;
            text-align: center;
            background: var(--gray-50);
            transition: all 0.2s;
            cursor: pointer;
        }

        .upload-area.dragover {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
            padding: 20px 28px 32px;
        }

        .file-item, .folder-item {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius-md);
            padding: 20px 12px;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .file-item:hover, .folder-item:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .folder-icon, .file-icon {
            font-size: 44px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .file-name, .folder-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .file-size, .folder-count {
            font-size: 12px;
            color: var(--gray-500);
        }

        .action-btn {
            background: transparent;
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--gray-500);
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--gray-100);
            color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 64px 28px;
            color: var(--gray-500);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--border-radius-lg);
            width: 90%;
            max-width: 480px;
            padding: 28px;
            box-shadow: var(--shadow-xl);
        }

        .alert {
            padding: 14px 18px;
            border-radius: var(--border-radius-md);
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-success {
            background: var(--success-light);
            color: #065f46;
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: var(--danger-light);
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        .spinner {
            border: 3px solid var(--gray-200);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            .app-main { flex-direction: column; }
            .sidebar { width: 100%; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }
    </style>
</head>
<body>

<!-- Authentication Container -->
<div id="auth-container" class="auth-container">
    <div class="auth-box">
        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Sign in</div>
            <div class="auth-tab" data-tab="register">Create account</div>
        </div>
        <form id="login-form" class="auth-form active">
            <div class="form-group"><label>Email</label><input type="email" id="login-email" class="form-control" placeholder="hello@example.com"></div>
            <div class="form-group"><label>Password</label><input type="password" id="login-password" class="form-control" placeholder="••••••"></div>
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            <div class="divider"><span>or</span></div>
            <button type="button" id="google-login-btn" class="btn btn-google btn-block"><i class="fab fa-google"></i> Continue with Google</button>
        </form>
        <form id="register-form" class="auth-form">
            <div class="form-group"><label>Full name</label><input type="text" id="register-fullname" class="form-control" placeholder="John Doe"></div>
            <div class="form-group"><label>Email</label><input type="email" id="register-email" class="form-control" placeholder="hello@example.com"></div>
            <div class="form-group"><label>Password</label><input type="password" id="register-password" class="form-control" placeholder="Create a password"></div>
            <button type="submit" class="btn btn-primary btn-block">Create account</button>
            <div class="divider"><span>or</span></div>
            <button type="button" id="google-register-btn" class="btn btn-google btn-block"><i class="fab fa-google"></i> Sign up with Google</button>
        </form>
        <div id="auth-alert" class="alert" style="display:none;"></div>
    </div>
</div>

<!-- Main App Container -->
<div id="app-container" class="app-container">
    <header class="app-header">
        <div class="container header-content">
            <div class="logo"><i class="fas fa-cloud-arrow-up"></i> Cloud Drive</div>
            <div class="search-bar"><input type="text" id="search-input" class="form-control" placeholder="Search files..."></div>
            <div class="user-info"><div class="user-avatar" id="user-avatar">JD</div><div><div id="user-name" style="font-weight:500;"></div><button id="logout-btn" class="action-btn" style="font-size:12px;">Logout</button></div></div>
        </div>
    </header>
    <main class="container app-main">
        <aside class="sidebar">
            <div class="nav-item active" data-section="files"><i class="fas fa-folder"></i> My Files</div>
            <div class="nav-item" data-section="recent"><i class="fas fa-clock"></i> Recent</div>
            <div class="nav-item" data-section="shared"><i class="fas fa-share-alt"></i> Shared</div>
            <div class="nav-item" data-section="trash"><i class="fas fa-trash-alt"></i> Trash</div>
            <div class="storage-info"><h4>Storage</h4><div class="storage-bar"><div id="storage-used-bar" class="storage-used"></div></div><div id="storage-text">0 GB of 10 GB used</div></div>
        </aside>
        <section class="content">
            <div class="content-header"><div class="folder-breadcrumb" id="breadcrumb"><div class="breadcrumb-item active" data-id="root">My Drive</div></div><div class="action-buttons"><button id="new-folder-btn" class="btn btn-outline"><i class="fas fa-folder-plus"></i> New Folder</button><button id="upload-btn" class="btn btn-primary"><i class="fas fa-upload"></i> Upload</button><input type="file" id="file-input" multiple style="display:none;"></div></div>
            <div id="upload-area" class="upload-area"><div class="upload-icon"><i class="fas fa-cloud-upload-alt fa-2x"></i></div><h3>Drag & drop files</h3><p>or click to browse</p></div>
            <div id="alerts-container"></div>
            <div id="files-container"><div class="spinner" id="loading-spinner" style="display:none;"></div><div id="files-content"><div class="empty-state"><i class="fas fa-folder-open fa-3x"></i><h3>No files yet</h3><p>Upload your first file or create a new folder</p></div></div></div>
        </section>
    </main>
</div>

<!-- Modals -->
<div id="folder-modal" class="modal"><div class="modal-content"><div class="modal-header" style="display:flex;justify-content:space-between;margin-bottom:20px;"><h3>New folder</h3><button class="modal-close" data-modal="folder-modal">&times;</button></div><form id="folder-form"><div class="form-group"><label>Folder name</label><input type="text" id="folder-name" class="form-control" placeholder="Untitled folder"></div><button type="submit" class="btn btn-primary btn-block">Create</button></form></div></div>
<div id="preview-modal" class="modal"><div class="modal-content"><div class="modal-header" style="display:flex;justify-content:space-between;margin-bottom:20px;"><h3 id="preview-title">Preview</h3><button class="modal-close" data-modal="preview-modal">&times;</button></div><div id="preview-content"></div><div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px;"><button id="download-btn" class="btn btn-outline">Download</button><button id="share-btn" class="btn btn-outline">Share</button><button id="delete-preview-btn" class="btn" style="background:#fee2e2;color:#b91c1c;">Delete</button></div></div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    // ================================
    // CONFIGURATION & STATE
    // ================================
    const API_BASE_URL = 'https://drive-1-r8nr.onrender.com';
    const GOOGLE_CLIENT_ID = '304984836974-0o5rdilg1pdvg3almd5js4b42je8p6e3.apps.googleusercontent.com';
    
    let currentToken = null;
    let currentUser = null;
    let currentFolderId = null;
    let currentFiles = [];
    let currentFolders = [];
    let folderHistory = [{ id: null, name: 'My Drive' }];
    let currentPreviewFileId = null;

    // DOM Elements
    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const authTabs = document.querySelectorAll('.auth-tab');
    const authAlert = document.getElementById('auth-alert');
    const logoutBtn = document.getElementById('logout-btn');
    const userAvatar = document.getElementById('user-avatar');
    const userNameSpan = document.getElementById('user-name');
    const storageUsedBar = document.getElementById('storage-used-bar');
    const storageTextSpan = document.getElementById('storage-text');
    const searchInput = document.getElementById('search-input');
    const newFolderBtn = document.getElementById('new-folder-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const fileInput = document.getElementById('file-input');
    const uploadArea = document.getElementById('upload-area');
    const filesContent = document.getElementById('files-content');
    const loadingSpinner = document.getElementById('loading-spinner');
    const alertsContainer = document.getElementById('alerts-container');
    const folderModal = document.getElementById('folder-modal');
    const previewModal = document.getElementById('preview-modal');
    const folderForm = document.getElementById('folder-form');
    const folderNameInput = document.getElementById('folder-name');
    const previewContentDiv = document.getElementById('preview-content');
    const previewTitleSpan = document.getElementById('preview-title');
    const downloadBtnModal = document.getElementById('download-btn');
    const shareBtnModal = document.getElementById('share-btn');
    const deletePreviewBtnModal = document.getElementById('delete-preview-btn');
    const googleLoginBtn = document.getElementById('google-login-btn');
    const googleRegisterBtn = document.getElementById('google-register-btn');
    const breadcrumbDiv = document.getElementById('breadcrumb');

    // ================================
    // HELPER FUNCTIONS
    // ================================
    function showAuth() {
        authContainer.style.display = 'flex';
        appContainer.style.display = 'none';
        if (authAlert) authAlert.style.display = 'none';
    }

    function showApp() {
        authContainer.style.display = 'none';
        appContainer.style.display = 'block';
        if (currentUser) {
            userNameSpan.textContent = currentUser.full_name;
            const initials = currentUser.full_name.split(' ').map(n => n[0]).join('').toUpperCase();
            userAvatar.textContent = initials || 'U';
        }
    }

    function showAlert(message, type) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type}`;
        alertDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${message}`;
        alertsContainer.appendChild(alertDiv);
        setTimeout(() => alertDiv.remove(), 4500);
    }

    function showAuthAlert(message, type) {
        authAlert.className = `alert alert-${type}`;
        authAlert.style.display = 'flex';
        authAlert.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> ${message}`;
        setTimeout(() => authAlert.style.display = 'none', 4000);
    }

    function showModal(modalId) {
        document.getElementById(modalId).classList.add('active');
    }

    function hideModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ================================
    // API & CORE LOGIC
    // ================================
    async function loadStorageInfo() {
        try {
            const response = await fetch(`${API_BASE_URL}/storage/info`, {
                headers: { 'Authorization': `Bearer ${currentToken}` }
            });
            if (response.ok) {
                const data = await response.json();
                const percentage = Math.min(data.percentage, 100);
                const usedGB = (data.used / 1073741824).toFixed(2);
                const limitGB = (data.limit / 1073741824).toFixed(0);
                storageUsedBar.style.width = `${percentage}%`;
                storageTextSpan.textContent = `${usedGB} GB of ${limitGB} GB used`;
            }
        } catch (error) {
            console.error('Storage info error:', error);
        }
    }

    async function loadFilesAndFolders(folderId = null) {
        currentFolderId = folderId;
        loadingSpinner.style.display = 'block';
        filesContent.style.display = 'none';
        try {
            const foldersUrl = `${API_BASE_URL}/folders?parent_id=${folderId === null ? 'null' : folderId}`;
            const foldersRes = await fetch(foldersUrl, { headers: { 'Authorization': `Bearer ${currentToken}` } });
            if (!foldersRes.ok) throw new Error('Failed to load folders');
            currentFolders = await foldersRes.json();

            const filesUrl = `${API_BASE_URL}/files?folder_id=${folderId === null ? 'null' : folderId}`;
            const filesRes = await fetch(filesUrl, { headers: { 'Authorization': `Bearer ${currentToken}` } });
            if (!filesRes.ok) throw new Error('Failed to load files');
            currentFiles = await filesRes.json();

            // Update breadcrumb
            if (folderId) {
                const folderInfoRes = await fetch(`${API_BASE_URL}/folders/${folderId}`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                if (folderInfoRes.ok) {
                    const folder = await folderInfoRes.json();
                    const idx = folderHistory.findIndex(h => h.id === folderId);
                    if (idx !== -1) folderHistory = folderHistory.slice(0, idx + 1);
                    else folderHistory.push({ id: folderId, name: folder.name });
                }
            } else {
                folderHistory = [{ id: null, name: 'My Drive' }];
            }
            updateBreadcrumbUI();
            renderFilesAndFolders();
        } catch (error) {
            showAlert('Failed to load content', 'error');
        } finally {
            loadingSpinner.style.display = 'none';
            filesContent.style.display = 'block';
        }
    }

    function updateBreadcrumbUI() {
        breadcrumbDiv.innerHTML = '';
        folderHistory.forEach((folder, idx) => {
            if (idx > 0) {
                const sep = document.createElement('div');
                sep.className = 'breadcrumb-separator';
                sep.textContent = '/';
                sep.style.margin = '0 6px';
                sep.style.color = '#9ca3af';
                breadcrumbDiv.appendChild(sep);
            }
            const crumb = document.createElement('div');
            crumb.className = `breadcrumb-item ${idx === folderHistory.length - 1 ? 'active' : ''}`;
            crumb.textContent = folder.name;
            crumb.setAttribute('data-id', folder.id);
            if (idx < folderHistory.length - 1) {
                crumb.addEventListener('click', () => loadFilesAndFolders(folder.id));
            }
            breadcrumbDiv.appendChild(crumb);
        });
    }

    function renderFilesAndFolders() {
        if (!currentFolders.length && !currentFiles.length) {
            filesContent.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open fa-3x"></i><h3>No files yet</h3><p>Upload your first file or create a new folder</p></div>`;
            return;
        }
        const grid = document.createElement('div');
        grid.className = 'file-grid';
        
        // Render folders
        currentFolders.forEach(folder => {
            const div = document.createElement('div');
            div.className = 'folder-item';
            div.innerHTML = `
                <div class="folder-icon"><i class="fas fa-folder"></i></div>
                <div class="folder-name">${escapeHtml(folder.name)}</div>
                <div class="folder-count">${folder.folder_count || 0} folders, ${folder.file_count || 0} files</div>
                <div class="folder-actions">
                    <button class="action-btn" data-action="open" data-id="${folder.id}" title="Open"><i class="fas fa-folder-open"></i></button>
                    <button class="action-btn" data-action="delete-folder" data-id="${folder.id}" title="Delete"><i class="fas fa-trash"></i></button>
                </div>
            `;
            grid.appendChild(div);
        });
        
        // Render files
        currentFiles.forEach(file => {
            let icon = 'fa-file';
            if (file.mime_type?.startsWith('image/')) icon = 'fa-file-image';
            else if (file.mime_type?.includes('pdf')) icon = 'fa-file-pdf';
            else if (file.mime_type?.includes('video')) icon = 'fa-file-video';
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <div class="file-icon"><i class="fas ${icon}"></i></div>
                <div class="file-name" title="${escapeHtml(file.original_filename)}">${escapeHtml(file.original_filename)}</div>
                <div class="file-size">${formatFileSize(file.file_size)}</div>
                <div class="file-actions">
                    <button class="action-btn" data-action="preview" data-id="${file.id}" title="Preview"><i class="fas fa-eye"></i></button>
                    <button class="action-btn" data-action="download" data-id="${file.id}" title="Download"><i class="fas fa-download"></i></button>
                    <button class="action-btn" data-action="delete" data-id="${file.id}" title="Delete"><i class="fas fa-trash"></i></button>
                </div>
            `;
            grid.appendChild(div);
        });
        
        filesContent.innerHTML = '';
        filesContent.appendChild(grid);
        
        // Attach event listeners dynamically
        document.querySelectorAll('[data-action="open"]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); loadFilesAndFolders(parseInt(btn.dataset.id)); });
        });
        document.querySelectorAll('[data-action="preview"]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); previewFile(parseInt(btn.dataset.id)); });
        });
        document.querySelectorAll('[data-action="download"]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                try {
                    const res = await fetch(`${API_BASE_URL}/files/${id}/download`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                    const data = await res.json();
                    if (data.download_url) window.open(data.download_url, '_blank');
                } catch (err) { showAlert('Download failed', 'error'); }
            });
        });
        document.querySelectorAll('[data-action="delete"]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (confirm('Delete this file permanently?')) {
                    const id = parseInt(btn.dataset.id);
                    await fetch(`${API_BASE_URL}/files/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${currentToken}` } });
                    showAlert('File deleted', 'success');
                    loadFilesAndFolders(currentFolderId);
                    loadStorageInfo();
                }
            });
        });
        document.querySelectorAll('[data-action="delete-folder"]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (confirm('Delete folder and all contents?')) {
                    const id = parseInt(btn.dataset.id);
                    await fetch(`${API_BASE_URL}/folders/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${currentToken}` } });
                    showAlert('Folder deleted', 'success');
                    loadFilesAndFolders(currentFolderId);
                    loadStorageInfo();
                }
            });
        });
    }

    async function previewFile(fileId) {
        currentPreviewFileId = fileId;
        const res = await fetch(`${API_BASE_URL}/files/${fileId}`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
        const file = await res.json();
        previewTitleSpan.textContent = escapeHtml(file.original_filename);
        previewContentDiv.innerHTML = '';
        if (file.mime_type?.startsWith('image/') && file.preview_url) {
            const img = document.createElement('img');
            img.src = file.preview_url;
            img.style.maxWidth = '100%';
            img.style.borderRadius = '12px';
            previewContentDiv.appendChild(img);
        } else {
            previewContentDiv.innerHTML = `<div style="text-align:center;padding:32px"><i class="fas fa-file fa-4x" style="color:#3b82f6"></i><p>${escapeHtml(file.original_filename)}<br>${formatFileSize(file.file_size)}</p></div>`;
        }
        downloadBtnModal.onclick = () => {
            fetch(`${API_BASE_URL}/files/${fileId}/download`, { headers: { 'Authorization': `Bearer ${currentToken}` } })
                .then(r => r.json()).then(d => { if (d.download_url) window.open(d.download_url); });
        };
        deletePreviewBtnModal.onclick = () => {
            if (confirm('Delete permanently?')) {
                fetch(`${API_BASE_URL}/files/${fileId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${currentToken}` } })
                    .then(() => { hideModal('preview-modal'); loadFilesAndFolders(currentFolderId); loadStorageInfo(); showAlert('Deleted', 'success'); });
            }
        };
        showModal('preview-modal');
    }

    async function uploadFiles(fileList) {
        if (!fileList.length) return;
        for (const file of fileList) {
            const formData = new FormData();
            formData.append('file', file);
            const url = `${API_BASE_URL}/files/upload${currentFolderId ? `?folder_id=${currentFolderId}` : ''}`;
            try {
                await fetch(url, { method: 'POST', headers: { 'Authorization': `Bearer ${currentToken}` }, body: formData });
            } catch (err) { showAlert(`Failed: ${file.name}`, 'error'); }
        }
        showAlert('Upload completed', 'success');
        loadFilesAndFolders(currentFolderId);
        loadStorageInfo();
    }

    function initGoogleSignIn() {
        if (window.google?.accounts) {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: async (response) => {
                    try {
                        const backendRes = await fetch(`${API_BASE_URL}/auth/google`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ credential: response.credential })
                        });
                        const authData = await backendRes.json();
                        currentToken = authData.access_token;
                        currentUser = authData.user;
                        localStorage.setItem('cloud_drive_token', currentToken);
                        localStorage.setItem('cloud_drive_user', JSON.stringify(currentUser));
                        showApp();
                        loadStorageInfo();
                        loadFilesAndFolders();
                        showAlert('Google sign-in successful', 'success');
                    } catch (err) { showAuthAlert('Google auth failed', 'error'); }
                }
            });
        }
    }

    // ================================
    // EVENT LISTENERS
    // ================================
    function bindEvents() {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const fd = new URLSearchParams();
            fd.append('username', email);
            fd.append('password', password);
            const res = await fetch(`${API_BASE_URL}/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: fd });
            if (res.ok) {
                const data = await res.json();
                currentToken = data.access_token;
                const userRes = await fetch(`${API_BASE_URL}/users/me/`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                currentUser = await userRes.json();
                localStorage.setItem('cloud_drive_token', currentToken);
                localStorage.setItem('cloud_drive_user', JSON.stringify(currentUser));
                showApp();
                loadStorageInfo();
                loadFilesAndFolders();
                showAlert('Welcome back!', 'success');
            } else showAuthAlert('Invalid credentials', 'error');
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const full = document.getElementById('register-fullname').value;
            const email = document.getElementById('register-email').value;
            const pass = document.getElementById('register-password').value;
            const res = await fetch(`${API_BASE_URL}/users/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, full_name: full, password: pass }) });
            if (res.ok) { showAuthAlert('Account created! Please sign in.', 'success'); document.querySelector('[data-tab="login"]').click(); }
            else showAuthAlert('Registration failed', 'error');
        });

        authTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const name = tab.dataset.tab;
                authTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                document.getElementById(`${name}-form`).classList.add('active');
                authAlert.style.display = 'none';
            });
        });

        logoutBtn.addEventListener('click', () => { localStorage.clear(); currentToken = null; showAuth(); });
        newFolderBtn.addEventListener('click', () => showModal('folder-modal'));
        folderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = folderNameInput.value.trim();
            if (!name) return;
            await fetch(`${API_BASE_URL}/folders/`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentToken}` }, body: JSON.stringify({ name, parent_id: currentFolderId }) });
            hideModal('folder-modal');
            loadFilesAndFolders(currentFolderId);
            showAlert('Folder created', 'success');
        });
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => uploadFiles(e.target.files));
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); uploadFiles(e.dataTransfer.files); });
        uploadArea.addEventListener('click', () => fileInput.click());
        document.querySelectorAll('.modal-close').forEach(btn => btn.addEventListener('click', () => hideModal(btn.dataset.modal)));
        window.addEventListener('click', (e) => { if (e.target.classList.contains('modal')) hideModal(e.target.id); });
        
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const q = searchInput.value.trim();
                if (!q) { loadFilesAndFolders(currentFolderId); return; }
                const res = await fetch(`${API_BASE_URL}/search?query=${encodeURIComponent(q)}`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                const results = await res.json();
                filesContent.innerHTML = `<div class="file-grid">${results.map(f => `<div class="file-item"><div class="file-icon"><i class="fas fa-file"></i></div><div class="file-name">${escapeHtml(f.original_filename)}</div><div class="file-size">${formatFileSize(f.file_size)}</div></div>`).join('')}</div>`;
            }, 400);
        });
        
        const googleSignPopup = () => { if (window.google?.accounts) google.accounts.id.prompt(); else showAuthAlert('Google not ready', 'error'); };
        googleLoginBtn?.addEventListener('click', googleSignPopup);
        googleRegisterBtn?.addEventListener('click', googleSignPopup);
    }

    // ================================
    // INITIALIZATION
    // ================================
    document.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('cloud_drive_token');
        const savedUser = localStorage.getItem('cloud_drive_user');
        if (savedToken && savedUser) {
            currentToken = savedToken;
            currentUser = JSON.parse(savedUser);
            showApp();
            loadStorageInfo();
            loadFilesAndFolders();
        } else showAuth();
        bindEvents();
        initGoogleSignIn();
    });
</script>
</body>
</html>
