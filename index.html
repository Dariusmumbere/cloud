<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0b;
            --surface: #111113;
            --surface-2: #18181b;
            --surface-3: #1f1f23;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.14);
            --text: #f4f4f5;
            --text-2: #a1a1aa;
            --text-3: #71717a;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dim: rgba(99,102,241,0.12);
            --accent-dim-hover: rgba(99,102,241,0.2);
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow: 0 4px 16px rgba(0,0,0,0.5);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.6);
            --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
            --sidebar-w: 240px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 99px; }

        /* ══════════════════════════════════════
           AUTH
        ══════════════════════════════════════ */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            pointer-events: none;
        }

        .auth-container::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(129,140,248,0.1) 0%, transparent 70%);
            bottom: -80px;
            right: -80px;
            pointer-events: none;
        }

        .auth-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 420px;
            padding: 36px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .auth-logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
        }

        .auth-logo-text {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .auth-heading {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .auth-subheading {
            font-size: 14px;
            color: var(--text-2);
            margin-bottom: 28px;
        }

        .auth-tabs {
            display: flex;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            padding: 3px;
            margin-bottom: 26px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-3);
            border-radius: calc(var(--radius-sm) - 2px);
            transition: var(--transition);
        }

        .auth-tab.active {
            background: var(--surface-3);
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }

        .auth-form { display: none; }
        .auth-form.active { display: block; }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            margin-bottom: 7px;
        }

        .form-control {
            width: 100%;
            padding: 10px 13px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            transition: var(--transition);
        }

        .form-control::placeholder { color: var(--text-3); }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface-3);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            letter-spacing: -0.1px;
        }

        .btn:hover { background: var(--accent-light); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-block { width: 100%; }

        .btn-ghost {
            background: var(--surface-3);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-hover); }

        .btn-danger-soft {
            background: rgba(244,63,94,0.12);
            color: var(--danger);
            border: 1px solid rgba(244,63,94,0.2);
        }
        .btn-danger-soft:hover { background: rgba(244,63,94,0.2); }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        .btn-google {
            background: var(--surface-3);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-google:hover { border-color: var(--border-hover); background: var(--surface-2); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-3);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ══════════════════════════════════════
           APP LAYOUT
        ══════════════════════════════════════ */
        .app-container {
            display: none;
            min-height: 100vh;
        }

        /* Header */
        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
            text-decoration: none;
            flex-shrink: 0;
            width: var(--sidebar-w);
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
        }

        .search-bar {
            flex: 1;
            max-width: 480px;
            position: relative;
        }

        .search-bar .fa-search {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: 13px;
            pointer-events: none;
        }

        .search-bar .form-control {
            padding-left: 35px;
            height: 36px;
            font-size: 13px;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 12px 5px 5px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 99px;
            cursor: pointer;
            transition: var(--transition);
        }
        .user-pill:hover { border-color: var(--border-hover); }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .user-name-small {
            font-size: 13px;
            font-weight: 500;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #logout-btn {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: var(--radius-sm);
        }

        /* Body layout */
        .app-body {
            display: flex;
            height: calc(100vh - 56px);
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px 10px;
            overflow-y: auto;
        }

        .sidebar-section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-3);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0 10px;
            margin: 14px 0 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-2);
            transition: var(--transition);
            text-decoration: none;
        }

        .nav-item:hover { background: var(--surface-2); color: var(--text); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent-light); }

        .nav-item i {
            width: 16px;
            text-align: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .storage-card {
            margin: 14px 0 4px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .storage-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .storage-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
        }

        .storage-pct {
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            color: var(--text-3);
        }

        .storage-bar-track {
            height: 4px;
            background: var(--surface-3);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .storage-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 99px;
            transition: width 0.6s ease;
        }

        .storage-text {
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            color: var(--text-3);
        }

        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--bg);
        }

        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 16px;
        }

        .folder-breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-3);
            cursor: pointer;
            padding: 3px 6px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        .breadcrumb-item:hover { color: var(--text-2); background: var(--surface-2); }
        .breadcrumb-item.active { color: var(--text); cursor: default; background: none; }

        .breadcrumb-sep {
            color: var(--text-3);
            font-size: 13px;
            user-select: none;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        /* Upload zone */
        .upload-area {
            border: 1.5px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface);
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .upload-area.dragover { box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

        .upload-icon {
            width: 48px;
            height: 48px;
            background: var(--accent-dim);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent-light);
            margin: 0 auto 14px;
        }

        .upload-area h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-area p {
            font-size: 13px;
            color: var(--text-3);
        }

        /* Alerts */
        #alerts-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 13.5px;
            font-weight: 500;
            max-width: 340px;
            pointer-events: all;
            animation: slideIn 0.22s ease;
            box-shadow: var(--shadow-lg);
            border: 1px solid transparent;
        }

        @keyframes slideIn {
            from { opacity:0; transform: translateX(20px); }
            to   { opacity:1; transform: translateX(0); }
        }

        .alert-success {
            background: rgba(16,185,129,0.12);
            border-color: rgba(16,185,129,0.25);
            color: #6ee7b7;
        }
        .alert-error {
            background: rgba(244,63,94,0.12);
            border-color: rgba(244,63,94,0.25);
            color: #fda4af;
        }

        /* Auth alert (in-box) */
        #auth-alert {
            margin-top: 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            padding: 10px 14px;
            display: none;
        }
        #auth-alert.active { display: block; }

        /* File Grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .file-item, .folder-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 14px 14px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .file-item:hover, .folder-item:hover {
            border-color: var(--border-hover);
            background: var(--surface-2);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .folder-icon, .file-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }

        .folder-icon { color: var(--accent-light); }
        .file-icon { color: var(--text-3); }

        .file-name, .folder-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size, .folder-count {
            font-size: 11.5px;
            font-family: 'DM Mono', monospace;
            color: var(--text-3);
            margin-bottom: 12px;
        }

        .file-actions, .folder-actions {
            display: flex;
            gap: 4px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-3);
            font-size: 13px;
            padding: 5px 7px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            line-height: 1;
        }
        .action-btn:hover { background: var(--surface-3); color: var(--text); }
        .action-btn.danger:hover { background: rgba(244,63,94,0.12); color: var(--danger); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 72px 20px;
            color: var(--text-3);
        }
        .empty-state-icon {
            width: 64px;
            height: 64px;
            background: var(--surface-2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--text-3);
            margin: 0 auto 20px;
        }
        .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
        .empty-state p { font-size: 13.5px; }

        /* Spinner */
        .spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 60px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; animation: fadeIn 0.18s ease; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 500px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            animation: scaleIn 0.22s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes scaleIn {
            from { opacity:0; transform: scale(0.94); }
            to   { opacity:1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .modal-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

        .modal-close {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-2);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover { background: var(--surface-3); color: var(--text); }

        .file-preview {
            max-width: 100%;
            max-height: 380px;
            border-radius: var(--radius);
            display: block;
            margin: 0 auto 16px;
            box-shadow: var(--shadow);
        }

        .preview-meta {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 16px;
        }
        .preview-meta-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }
        .preview-meta-row span:first-child { color: var(--text-3); }
        .preview-meta-row span:last-child { font-family: 'DM Mono', monospace; color: var(--text); }

        .preview-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .app-body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); padding: 8px 10px; }
            .sidebar-section-label { display: none; }
            .nav-item { padding: 7px 10px; font-size: 13px; }
            .storage-card { display: none; }
        }

        @media (max-width: 640px) {
            .content { padding: 16px; }
            .content-header { flex-direction: column; align-items: flex-start; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .logo-text { display: none; }
        }
    </style>
</head>
<body>

<!-- ══════════════════════════ AUTH ══════════════════════════ -->
<div id="auth-container" class="auth-container">
    <div class="auth-box">
        <div class="auth-logo">
            <div class="auth-logo-icon"><i class="fas fa-cloud"></i></div>
            <span class="auth-logo-text">Cloud Drive</span>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Sign in</div>
            <div class="auth-tab" data-tab="register">Create account</div>
        </div>

        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" class="form-control" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-block" style="margin-top: 4px;">Sign in</button>
            <div class="divider"><span>or</span></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    const API_BASE_URL = 'https://drive-1-r8nr.onrender.com';
    const GOOGLE_CLIENT_ID = '304984836974-0o5rdilg1pdvg3almd5js4b42je8p6e3.apps.googleusercontent.com';

    let currentUser = null, currentToken = null, currentFolderId = null;
    let currentFiles = [], currentFolders = [], currentPreviewFileId = null;
    let folderHistory = [{ id: null, name: 'My Drive' }];

    const $ = id => document.getElementById(id);
    const authContainer  = $('auth-container');
    const appContainer   = $('app-container');
    const loginForm      = $('login-form');
    const registerForm   = $('register-form');
    const authAlert      = $('auth-alert');
    const logoutBtn      = $('logout-btn');
    const userAvatar     = $('user-avatar');
    const userName       = $('user-name');
    const storageUsedBar = $('storage-used-bar');
    const storagePct     = $('storage-pct');
    const storageText    = $('storage-text');
    const searchInput    = $('search-input');
    const breadcrumb     = $('breadcrumb');
    const newFolderBtn   = $('new-folder-btn');
    const uploadBtn      = $('upload-btn');
    const fileInput      = $('file-input');
    const uploadArea     = $('upload-area');
    const filesContent   = $('files-content');
    const loadingSpinner = $('loading-spinner');
    const alertsContainer= $('alerts-container');
    const folderModal    = $('folder-modal');
    const previewModal   = $('preview-modal');
    const folderForm     = $('folder-form');
    const folderNameInput= $('folder-name');
    const previewContent = $('preview-content');
    const previewTitle   = $('preview-title');
    const downloadBtn    = $('download-btn');
    const shareBtn       = $('share-btn');
    const deletePreviewBtn=$('delete-preview-btn');
    const googleLoginBtn = $('google-login-btn');
    const googleRegisterBtn=$('google-register-btn');
    const authTabs       = document.querySelectorAll('.auth-tab');
    const navItems       = document.querySelectorAll('.nav-item');

    document.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('cloud_drive_token');
        const savedUser  = localStorage.getItem('cloud_drive_user');
        if (savedToken && savedUser) {
            try {
                currentToken = savedToken;
                currentUser  = JSON.parse(savedUser);
                showApp(); loadStorageInfo(); loadFilesAndFolders();
            } catch (e) {
                localStorage.removeItem('cloud_drive_token');
                localStorage.removeItem('cloud_drive_user');
            }
        }
        const hash = window.location.hash;
        if (hash && hash.includes('token=')) {
            const m = hash.match(/token=([^&]+)/);
            if (m) { localStorage.setItem('cloud_drive_token', m[1]); window.location.hash = ''; fetchUserInfo(m[1]); }
        }
        window.addEventListener('message', handleGoogleAuthMessage);
    });

    function handleGoogleAuthMessage(event) {
        if (event.origin !== API_BASE_URL) return;
        if (event.data.type === 'google-auth-success') {
            const d = event.data.data;
            currentToken = d.access_token; currentUser = d.user;
            localStorage.setItem('cloud_drive_token', currentToken);
            localStorage.setItem('cloud_drive_user', JSON.stringify(currentUser));
            showApp(); loadStorageInfo(); loadFilesAndFolders();
            showAlert('Google sign-in successful!', 'success');
        } else if (event.data.type === 'google-auth-error') {
            showAuthAlert(`Google sign-in failed: ${event.data.error}`, 'error');
        }
    }

    async function fetchUserInfo(token) {
        try {
            const r = await fetch(`${API_BASE_URL}/users/me/`, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
            if (!r.ok) throw new Error('Failed to get user info');
            currentUser = await r.json(); currentToken = token;
            localStorage.setItem('cloud_drive_token', currentToken);
            localStorage.setItem('cloud_drive_user', JSON.stringify(currentUser));
            showApp(); loadStorageInfo(); loadFilesAndFolders();
            showAlert('Login successful!', 'success');
        } catch (e) {
            localStorage.removeItem('cloud_drive_token');
            showAuthAlert('Invalid token. Please login again.', 'error');
        }
    }

    function initGoogleSignIn() {
        if (window.google && window.google.accounts) {
            google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredentialResponse });
        }
    }

    async function handleGoogleCredentialResponse(response) {
        try {
            const r = await fetch(`${API_BASE_URL}/auth/google`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            });
            if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Google auth failed'); }
            const d = await r.json();
            currentToken = d.access_token; currentUser = d.user;
            localStorage.setItem('cloud_drive_token', currentToken);
            localStorage.setItem('cloud_drive_user', JSON.stringify(currentUser));
            showApp(); loadStorageInfo(); loadFilesAndFolders();
            showAlert('Google sign-in successful!', 'success');
        } catch (e) { showAuthAlert(`Google sign-in failed: ${e.message}`, 'error'); }
    }

    function signInWithGooglePopup() {
        if (!window.google || !window.google.accounts) { showAuthAlert('Google Sign-In unavailable. Refresh and try again.', 'error'); return; }
        google.accounts.id.prompt();
    }

    googleLoginBtn.addEventListener('click', signInWithGooglePopup);
    googleRegisterBtn.addEventListener('click', signInWithGooglePopup);

    authTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const t = tab.getAttribute('data-tab');
            authTabs.forEach(x => x.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            $(`${t}-form`).classList.add('active');
            authAlert.classList.remove('active');
        });
    });

    loginForm.addEventListener('submit', async e => {
        e.preventDefault();
        const email = $('login-email').value, password = $('login-password').value;
        showAuthAlert('Signing in…', 'success');
        try {
            const fd = new URLSearchParams();
            fd.append('username', email); fd.append('password', password); fd.append('grant_type', 'password');
            const r = await fetch(`${API_BASE_URL}/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' }, body: fd });
            if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Invalid email or password'); }
            const data = await r.json(); currentToken = data.access_token;
            const ur = await fetch(`${API_BASE_URL}/users/me/`, { headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' } });
            if (!ur.ok) throw new Error('Failed to get user info');
            currentUser = await ur.json();
            localStorage.setItem('cloud_drive_token', currentToken);
            localStorage.setItem('cloud_drive_user', JSON.stringify(currentUser));
            showApp(); loadStorageInfo(); loadFilesAndFolders();
            showAlert('Welcome back!', 'success');
        } catch (e) { showAuthAlert(e.message, 'error'); }
    });

    registerForm.addEventListener('submit', async e => {
        e.preventDefault();
        const fullName = $('register-fullname').value, email = $('register-email').value, password = $('register-password').value;
        if (password.length < 6) { showAuthAlert('Password must be at least 6 characters', 'error'); return; }
        showAuthAlert('Creating your account…', 'success');
        try {
            const r = await fetch(`${API_BASE_URL}/users/`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ email, full_name: fullName, password }) });
            if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Registration failed'); }
            showAuthAlert('Account created! You can now sign in.', 'success');
            authTabs.forEach(x => x.classList.remove('active'));
            document.querySelector('[data-tab="login"]').classList.add('active');
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            loginForm.classList.add('active');
            registerForm.reset();
        } catch (e) { showAuthAlert(e.message, 'error'); }
    });

    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('cloud_drive_token'); localStorage.removeItem('cloud_drive_user');
        currentToken = null; currentUser = null; folderHistory = [{ id: null, name: 'My Drive' }];
        showAuth();
    });

    navItems.forEach(item => {
        item.addEventListener('click', () => {
            navItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            if (item.getAttribute('data-section') === 'files') loadFilesAndFolders(currentFolderId);
        });
    });

    newFolderBtn.addEventListener('click', () => { folderNameInput.value = ''; showModal('folder-modal'); });
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => uploadFiles(e.target.files));

    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
        e.preventDefault(); uploadArea.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) uploadFiles(e.dataTransfer.files);
    });
    uploadArea.addEventListener('click', () => fileInput.click());

    folderForm.addEventListener('submit', async e => {
        e.preventDefault();
        const name = folderNameInput.value.trim();
        if (!name) { showAlert('Please enter a folder name', 'error'); return; }
        try {
            const r = await fetch(`${API_BASE_URL}/folders/`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' }, body: JSON.stringify({ name, parent_id: currentFolderId }) });
            if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Failed to create folder'); }
            hideModal('folder-modal'); showAlert('Folder created', 'success'); loadFilesAndFolders();
        } catch (e) { showAlert(e.message, 'error'); }
    });

    document.querySelectorAll('.modal-close').forEach(btn => {
        btn.addEventListener('click', () => hideModal(btn.getAttribute('data-modal')));
    });
    window.addEventListener('click', e => { if (e.target.classList.contains('modal')) hideModal(e.target.id); });

    let searchTimeout;
    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const q = searchInput.value.trim();
            q ? searchFiles(q) : loadFilesAndFolders(currentFolderId);
        }, 500);
    });

    function showAuth() {
        authContainer.style.display = 'flex'; appContainer.style.display = 'none';
        authAlert.classList.remove('active');
    }

    function showApp() {
        authContainer.style.display = 'none'; appContainer.style.display = 'block';
        if (currentUser) {
            userName.textContent = currentUser.full_name;
            const initials = currentUser.full_name.split(' ').map(n => n[0]).join('').toUpperCase();
            userAvatar.textContent = initials || 'U';
            if (currentUser.auth_provider === 'google') userAvatar.style.background = 'linear-gradient(135deg,#4285f4,#34a853)';
        }
    }

    function showAuthAlert(msg, type) {
        authAlert.textContent = msg;
        authAlert.className = `alert alert-${type} active`;
        setTimeout(() => authAlert.classList.remove('active'), 5000);
    }

    function showAlert(msg, type) {
        const div = document.createElement('div');
        div.className = `alert alert-${type}`;
        div.textContent = msg;
        alertsContainer.appendChild(div);
        setTimeout(() => div.remove(), 4000);
    }

    function showModal(id) { $(id).classList.add('active'); }
    function hideModal(id) { $(id).classList.remove('active'); }

    async function loadStorageInfo() {
        try {
            const r = await fetch(`${API_BASE_URL}/storage/info`, { headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' } });
            if (!r.ok) { if (r.status === 401) { localStorage.removeItem('cloud_drive_token'); localStorage.removeItem('cloud_drive_user'); showAuth(); } return; }
            const d = await r.json();
            const pct = Math.min(d.percentage, 100);
            const usedGB = (d.used / 1024 / 1024 / 1024).toFixed(2);
            const limitGB = (d.limit / 1024 / 1024 / 1024).toFixed(0);
            storageUsedBar.style.width = `${pct}%`;
            storagePct.textContent = `${Math.round(pct)}%`;
            storageText.textContent = `${usedGB} GB of ${limitGB} GB`;
        } catch (e) { console.error(e); }
    }

    async function loadFilesAndFolders(folderId = null) {
        currentFolderId = folderId;
        loadingSpinner.style.display = 'block'; filesContent.style.display = 'none';
        try {
            const fParam = folderId !== null ? `parent_id=${folderId}` : `parent_id=null`;
            const fiParam = folderId !== null ? `folder_id=${folderId}` : `folder_id=null`;
            const [fr, ffr] = await Promise.all([
                fetch(`${API_BASE_URL}/folders?${fParam}`, { headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' } }),
                fetch(`${API_BASE_URL}/files?${fiParam}`, { headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' } })
            ]);
            if (fr.status === 401 || ffr.status === 401) { localStorage.removeItem('cloud_drive_token'); localStorage.removeItem('cloud_drive_user'); showAuth(); return; }
            if (!fr.ok) throw new Error('Failed to load folders');
            if (!ffr.ok) throw new Error('Failed to load files');
            currentFolders = await fr.json(); currentFiles = await ffr.json();
            if (folderId) {
                try {
                    const info = await fetch(`${API_BASE_URL}/folders/${folderId}`, { headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' } });
                    if (info.ok) { const f = await info.json(); updateBreadcrumb(folderId, f.name); }
                } catch (_) {}
            } else { updateBreadcrumb(null, 'My Drive'); }
            renderFilesAndFolders();
        } catch (e) { showAlert(e.message, 'error'); }
        finally { loadingSpinner.style.display = 'none'; filesContent.style.display = 'block'; }
    }

    function updateBreadcrumb(folderId, folderName) {
        if (folderId) {
            const idx = folderHistory.findIndex(f => f.id === folderId);
            if (idx !== -1) folderHistory = folderHistory.slice(0, idx + 1);
            else folderHistory.push({ id: folderId, name: folderName });
        } else { folderHistory = [{ id: null, name: 'My Drive' }]; }
        breadcrumb.innerHTML = '';
        folderHistory.forEach((folder, i) => {
            if (i > 0) { const sep = document.createElement('span'); sep.className = 'breadcrumb-sep'; sep.textContent = '/'; breadcrumb.appendChild(sep); }
            const crumb = document.createElement('div');
            crumb.className = `breadcrumb-item${i === folderHistory.length - 1 ? ' active' : ''}`;
            crumb.textContent = folder.name;
            crumb.setAttribute('data-id', folder.id);
            if (i < folderHistory.length - 1) crumb.addEventListener('click', () => loadFilesAndFolders(folder.id));
            breadcrumb.appendChild(crumb);
        });
    }

    function getFileIcon(mimeType) {
        if (!mimeType) return 'fa-file';
        if (mimeType.startsWith('image/')) return 'fa-file-image';
        if (mimeType.startsWith('video/')) return 'fa-file-video';
        if (mimeType.startsWith('audio/')) return 'fa-file-audio';
        if (mimeType.includes('pdf')) return 'fa-file-pdf';
        if (mimeType.includes('word') || mimeType.includes('document')) return 'fa-file-word';
        if (mimeType.includes('excel') || mimeType.includes('spreadsheet')) return 'fa-file-excel';
        if (mimeType.includes('zip') || mimeType.includes('compressed')) return 'fa-file-zipper';
        return 'fa-file';
    }

    function renderFilesAndFolders() {
        filesContent.innerHTML = '';
        if (currentFolders.length === 0 && currentFiles.length === 0) {
            filesContent.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-folder-open"></i></div><h3>Nothing here yet</h3><p>Upload your first file or create a new folder</p></div>`;
            return;
        }
        const grid = document.createElement('div'); grid.className = 'file-grid';
        currentFolders.forEach(folder => {
            const el = document.createElement('div'); el.className = 'folder-item';
            el.innerHTML = `<i class="fas fa-folder folder-icon"></i><div class="folder-name" title="${escapeHtml(folder.name)}">${escapeHtml(folder.name)}</div><div class="folder-count">${folder.folder_count||0} folders · ${folder.file_count||0} files</div><div class="folder-actions"><button class="action-btn" data-action="open" data-id="${folder.id}" title="Open"><i class="fas fa-arrow-right"></i></button><button class="action-btn danger" data-action="delete-folder" data-id="${folder.id}" title="Delete"><i class="fas fa-trash"></i></button></div>`;
            grid.appendChild(el);
        });
        currentFiles.forEach(file => {
            const icon = getFileIcon(file.mime_type);
            const el = document.createElement('div'); el.className = 'file-item';
            el.innerHTML = `<i class="fas ${icon} file-icon"></i><div class="file-name" title="${escapeHtml(file.original_filename)}">${escapeHtml(file.original_filename)}</div><div class="file-size">${formatFileSize(file.file_size)}</div><div class="file-actions"><button class="action-btn" data-action="preview" data-id="${file.id}" title="Preview"><i class="fas fa-eye"></i></button><button class="action-btn" data-action="download" data-id="${file.id}" title="Download"><i class="fas fa-download"></i></button><button class="action-btn danger" data-action="delete" data-id="${file.id}" title="Delete"><i class="fas fa-trash"></i></button></div>`;
            grid.appendChild(el);
        });
        filesContent.appendChild(grid);
        addItemEventListeners();
    }

    function addItemEventListeners() {
        document.querySelectorAll('[data-action="open"]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); loadFilesAndFolders(parseInt(btn.dataset.id)); }));
        document.querySelectorAll('[data-action="preview"]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); previewFile(parseInt(btn.dataset.id)); }));
        document.querySelectorAll('[data-action="download"]').forEach(btn => btn.addEventListener('click', async e => { e.stopPropagation(); await downloadFile(parseInt(btn.dataset.id)); }));
        document.querySelectorAll('[data-action="delete"]').forEach(btn => btn.addEventListener('click', async e => { e.stopPropagation(); if (confirm('Delete this file?')) await deleteFile(parseInt(btn.dataset.id)); }));
        document.querySelectorAll('[data-action="delete-folder"]').forEach(btn => btn.addEventListener('click', async e => { e.stopPropagation(); if (confirm('Delete this folder and all contents?')) await deleteFolder(parseInt(btn.dataset.id)); }));
        document.querySelectorAll('.folder-item').forEach(item => {
            const openBtn = item.querySelector('[data-action="open"]');
            if (openBtn) item.addEventListener('click', e => { if (!e.target.closest('.folder-actions')) loadFilesAndFolders(parseInt(openBtn.dataset.id)); });
        });
    }

    async function uploadFiles(fileList) {
        if (!fileList || fileList.length === 0) return;
        showAlert(`Uploading ${fileList.length} file${fileList.length > 1 ? 's' : ''}…`, 'success');
        for (let i = 0; i < fileList.length; i++) {
            const file = fileList[i];
            if (file.size > 10 * 1024 * 1024 * 1024) { showAlert(`"${file.name}" exceeds 10 GB limit`, 'error'); continue; }
            const fd = new FormData(); fd.append('file', file);
            let url = `${API_BASE_URL}/files/upload`; if (currentFolderId) url += `?folder_id=${currentFolderId}`;
            try {
                const r = await fetch(url, { method: 'POST', headers: { 'Authorization': `Bearer ${currentToken}` }, body: fd });
                if (!r.ok) { const e = await r.json(); throw new Error(e.detail || `Failed to upload "${file.name}"`); }
            } catch (e) { showAlert(e.message, 'error'); }
        }
        showAlert('Upload complete!', 'success');
        loadFilesAndFolders(currentFolderId); loadStorageInfo();
    }

    async function previewFile(fileId) {
        currentPreviewFileId = fileId;
        try {
            const r = await fetch(`${API_BASE_URL}/files/${fileId}`, { headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' } });
            if (!r.ok) throw new Error('Failed to load file');
            const file = await r.json();
            previewTitle.textContent = escapeHtml(file.original_filename);
            previewContent.innerHTML = '';
            downloadBtn.onclick = () => { if (file.download_url) window.open(file.download_url, '_blank'); };
            shareBtn.onclick = () => toggleFileShare(fileId, !file.is_public);
            shareBtn.innerHTML = file.is_public ? '<i class="fas fa-lock"></i> Make Private' : '<i class="fas fa-share"></i> Make Public';
            deletePreviewBtn.onclick = () => { if (confirm('Delete this file?')) { deleteFile(fileId); hideModal('preview-modal'); } };
            if (file.mime_type && file.mime_type.startsWith('image/') && file.preview_url) {
                const img = document.createElement('img'); img.src = file.preview_url; img.alt = file.original_filename; img.className = 'file-preview'; previewContent.appendChild(img);
            } else if (file.mime_type && file.mime_type.includes('pdf') && file.preview_url) {
                const embed = document.createElement('embed'); embed.src = file.preview_url; embed.type = 'application/pdf'; embed.className = 'file-preview'; embed.style.cssText = 'width:100%;height:380px'; previewContent.appendChild(embed);
            } else {
                const icon = getFileIcon(file.mime_type);
                previewContent.innerHTML = `<div style="text-align:center;padding:32px 0"><i class="fas ${icon}" style="font-size:56px;color:var(--accent-light);margin-bottom:16px;display:block"></i></div><div class="preview-meta"><div class="preview-meta-row"><span>Name</span><span>${escapeHtml(file.original_filename)}</span></div><div class="preview-meta-row"><span>Size</span><span>${formatFileSize(file.file_size)}</span></div><div class="preview-meta-row"><span>Type</span><span>${file.mime_type || 'Unknown'}</span></div><div class="preview-meta-row"><span>Uploaded</span><span>${new Date(file.created_at).toLocaleDateString()}</span></div><div class="preview-meta-row"><span>Visibility</span><span>${file.is_public ? 'Public' : 'Private'}</span></div></div>`;
            }
            showModal('preview-modal');
        } catch (e) { showAlert('Failed to preview file', 'error'); }
    }

    async function downloadFile(fileId) {
        try {
            const r = await fetch(`${API_BASE_URL}/files/${fileId}/download`, { headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' } });
            if (!r.ok) throw new Error('Failed to get download URL');
            const d = await r.json();
            if (d.download_url) window.open(d.download_url, '_blank');
            else throw new Error('No download URL available');
        } catch (e) { showAlert('Failed to download file', 'error'); }
    }

    async function deleteFile(fileId) {
        try {
            const r = await fetch(`${API_BASE_URL}/files/${fileId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${currentToken}` } });
            if (!r.ok) throw new Error('Failed to delete file');
            showAlert('File deleted', 'success'); loadFilesAndFolders(currentFolderId); loadStorageInfo();
        } catch (e) { showAlert('Failed to delete file', 'error'); }
    }

    async function deleteFolder(folderId) {
        try {
            const r = await fetch(`${API_BASE_URL}/folders/${folderId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${currentToken}` } });
            if (!r.ok) throw new Error('Failed to delete folder');
            showAlert('Folder deleted', 'success'); loadFilesAndFolders(currentFolderId); loadStorageInfo();
        } catch (e) { showAlert('Failed to delete folder', 'error'); }
    }

    async function toggleFileShare(fileId, isPublic) {
        try {
            const r = await fetch(`${API_BASE_URL}/files/${fileId}/share`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' }, body: JSON.stringify({ is_public: isPublic }) });
            if (!r.ok) throw new Error('Failed to update sharing');
            showAlert(`File is now ${isPublic ? 'public' : 'private'}`, 'success');
            if (currentPreviewFileId === fileId) previewFile(fileId);
        } catch (e) { showAlert('Failed to update file sharing', 'error'); }
    }

    async function searchFiles(query) {
        try {
            const r = await fetch(`${API_BASE_URL}/search?query=${encodeURIComponent(query)}`, { headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': 'application/json' } });
            if (!r.ok) throw new Error('Search failed');
            const files = await r.json();
            filesContent.innerHTML = '';
            if (files.length === 0) {
                filesContent.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-magnifying-glass"></i></div><h3>No results found</h3><p>Nothing matched "${escapeHtml(query)}"</p></div>`;
                return;
            }
            const header = document.createElement('div');
            header.style.cssText = 'font-size:13px;color:var(--text-3);margin-bottom:16px';
            header.textContent = `${files.length} result${files.length !== 1 ? 's' : ''} for "${query}"`;
            filesContent.appendChild(header);
            const grid = document.createElement('div'); grid.className = 'file-grid';
            files.forEach(file => {
                const icon = getFileIcon(file.mime_type);
                const el = document.createElement('div'); el.className = 'file-item';
                el.innerHTML = `<i class="fas ${icon} file-icon"></i><div class="file-name" title="${escapeHtml(file.original_filename)}">${escapeHtml(file.original_filename)}</div><div class="file-size">${formatFileSize(file.file_size)}</div><div class="file-actions"><button class="action-btn" data-action="preview" data-id="${file.id}"><i class="fas fa-eye"></i></button><button class="action-btn" data-action="download" data-id="${file.id}"><i class="fas fa-download"></i></button></div>`;
                grid.appendChild(el);
            });
            filesContent.appendChild(grid);
            addItemEventListeners();
        } catch (e) { showAlert('Search failed', 'error'); }
    }

    function formatFileSize(bytes) {
        if (!bytes) return '0 B';
        const k = 1024, s = ['B','KB','MB','GB','TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${s[i]}`;
    }

    function escapeHtml(text) {
        const d = document.createElement('div'); d.textContent = text; return d.innerHTML;
    }
</script>
</body>
